name: Android app

# Builds the Android app (the website in a native shell) and keeps the debug APK for 14 days, so a phone can
# install it without Android Studio. Runs when the app changes, or by hand from the Actions tab with the
# website's address.
on:
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Address of the Itqan website (https://...)'
        required: true
        default: 'https://itqan.example.org'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ITQAN_APP_URL: ${{ inputs.app_url || 'https://itqan.example.org' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Build the debug APK
        working-directory: apps/android
        run: pnpm apk
      - uses: actions/upload-artifact@v4
        with:
          name: itqan-debug-apk
          path: apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
