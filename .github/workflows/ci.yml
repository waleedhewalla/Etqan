name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: itqan_test
          POSTGRES_USER: itqan
          POSTGRES_PASSWORD: itqan_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itqan -d itqan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://itqan:itqan_test_password@localhost:5432/itqan_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      ENABLE_ASR: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate test database
        if: hashFiles('apps/core/package.json') != ''
        run: pnpm db:migrate

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # Builds the production images and runs the stack the way docs/DEPLOY.md describes (without Caddy, which
  # needs real domain names), so a broken Dockerfile or compose file fails here and not on a server.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Throwaway configuration
        run: |
          {
            echo "APP_DOMAIN=app.example.test"
            echo "API_DOMAIN=api.example.test"
            echo "ACME_EMAIL=ci@example.test"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 36 | tr -d '\n')"
            echo "MINIO_ACCESS_KEY=ci$(openssl rand -hex 6)"
            echo "MINIO_SECRET_KEY=$(openssl rand -hex 16)"
          } > .env

      - name: Compose file is valid
        run: docker compose -f compose.prod.yml config --quiet

      - name: Build images
        run: docker compose -f compose.prod.yml build api web

      - name: Production refuses to start with the public development secrets
        run: |
          set +e
          out=$(docker run --rm itqan-api 2>&1); code=$?
          echo "$out" | head -8
          test $code -ne 0
          echo "$out" | grep -q "Refusing to start in production"

      - name: Start the stack
        run: |
          # (not `up --wait`: it fails on one-shot containers such as `migrate`, which exit by design)
          docker compose -f compose.prod.yml up -d api web
          for svc in api web; do
            id=$(docker compose -f compose.prod.yml ps -q "$svc")
            for i in $(seq 1 60); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$id")
              [ "$status" = healthy ] && break
              if [ "$i" -eq 60 ]; then echo "$svc is $status after 3 minutes"; exit 1; fi
              sleep 3
            done
            echo "$svc healthy"
          done

      - name: Migrations ran, and the first institution can be created (twice, harmlessly)
        run: |
          for i in 1 2; do
            docker compose -f compose.prod.yml run --rm --no-deps api node dist/bootstrap.mjs \
              --slug ci-check --name "CI" --plan madrasa_pro \
              --dean-email dean@example.test --dean-name "Dean" \
              --teacher-email teacher@example.test --teacher-name "Teacher" --halaqa "Halaqa"
          done

      - name: API and web answer
        run: |
          api() { docker compose -f compose.prod.yml exec -T api node -e "fetch('http://127.0.0.1:4000$1').then(async r=>{console.log(r.status);process.exit(r.status===$2?0:1)}).catch(()=>process.exit(1))"; }
          web() { docker compose -f compose.prod.yml exec -T web node -e "fetch('http://127.0.0.1:3000$1').then(async r=>{console.log(r.status, r.headers.get('content-type'));process.exit(r.status===200?0:1)}).catch(()=>process.exit(1))"; }
          api /v1/health 200
          api /docs 404            # the API documentation is off in production
          web /auth/login
          web /sw.js
          web /manifest.json

      - name: Only Caddy may be reachable from outside
        run: |
          docker compose -f compose.prod.yml config --format json | python3 -c "
          import json,sys
          cfg=json.load(sys.stdin)['services']
          published={n:[p['published'] for p in s.get('ports',[])] for n,s in cfg.items() if s.get('ports')}
          print(published)
          assert set(published)=={'caddy'}, published
          "

      - name: Logs
        if: failure()
        run: docker compose -f compose.prod.yml logs --no-color --tail=80
