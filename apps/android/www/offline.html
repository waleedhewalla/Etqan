<head>

<title>إتقان</title>
<style>

  main { max-width: 22rem; }

  p { line-height: 1.8; margin: 0 0 1.5rem; }

<body>
<main>
  <h1>لا يوجد اتصال</h1>

  <button type="button" onclick="location.replace('/')">إعادة المحاولة</button>
</main>
</body>
</html>
