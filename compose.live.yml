# Live lessons: adds the media server to the production stack. Optional; without it the app runs as before
# and the teacher's «الدرس المباشر» tab says live lessons are not set up.
#
#   docker compose -f compose.prod.yml -f compose.live.yml up -d
#
# Needs in .env: LIVE_DOMAIN (a third DNS name pointing here), LIVEKIT_API_KEY, LIVEKIT_API_SECRET.
# Open in the firewall: 7881/tcp and 7882/udp. See docs/DEPLOY.md.
services:
  livekit:
    # Keep this in step with the livekit-client version in apps/web: an old server cannot publish audio
    # from a newer client.
    image: livekit/livekit-server:v1.10.0
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Media only. Signalling (7880) stays inside the stack, behind Caddy.
      - "7881:7881/tcp"
      - "7882:7882/udp"

  api:
    environment:
      LIVEKIT_URL: wss://${LIVE_DOMAIN:?set LIVE_DOMAIN in .env}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}

  caddy:
    environment:
      LIVE_DOMAIN: ${LIVE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile.base:ro
      - ./Caddyfile.live:/etc/caddy/Caddyfile:ro
