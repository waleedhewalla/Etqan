# Media server for live lessons (LiveKit). Used by compose.live.yml.
# The API key and secret come from LIVEKIT_KEYS in the environment, never from this file.
port: 7880            # signalling; reached through Caddy on LIVE_DOMAIN, never published directly
rtc:
  tcp_port: 7881      # media over TCP, for networks that block UDP
  udp_port: 7882      # media over UDP: one port, so the firewall rule is one line
  use_external_ip: true
room:
  empty_timeout: 300          # close a room nobody is in after five minutes
  departure_timeout: 20
logging:
  level: info
